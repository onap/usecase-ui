---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

name: '🔐 Security Scans (CLM)'

# yamllint disable-line rule:truthy
on:
  schedule:
    # Intentionally scheduled at an odd minute letting GitHub's queue
    # randomize the exact start.
    - cron: "37 0 * * 6"

  push:
    branches: ["main", "master"]
    paths:
      - "**"
      - "!.github/**"

  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:
        description: "Branch that change is against"
        required: false
        type: string
      GERRIT_CHANGE_ID:
        description: "The ID for the change"
        required: false
        type: string
      GERRIT_CHANGE_NUMBER:
        description: "The Gerrit number"
        required: false
        type: string
      GERRIT_CHANGE_URL:
        description: "URL to the change"
        required: false
        type: string
      GERRIT_EVENT_TYPE:
        description: "Type of Gerrit event"
        required: false
        type: string
      GERRIT_PATCHSET_NUMBER:
        description: "The patch number for the change"
        required: false
        type: string
      GERRIT_PATCHSET_REVISION:
        description: "The revision sha"
        required: false
        type: string
      GERRIT_PROJECT:
        description: "Project in Gerrit"
        required: false
        type: string
      GERRIT_REFSPEC:
        description: "Gerrit refspec of change"
        required: false
        type: string
      GERRIT_DISABLED:
        description: "Run without Gerrit components"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  # yamllint disable-line rule:line-length
  group: "gerrit-clm-${{ github.workflow }}-${{ github.event.inputs.GERRIT_CHANGE_ID || github.run_id }}"
  cancel-in-progress: true

jobs:
  notify:
    name: 'Notify Gerrit'
    if: github.event_name == 'workflow_dispatch' && inputs.GERRIT_DISABLED != true
    runs-on: ubuntu-latest
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Notify job start
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@a1c036a59b94c8ab89de26d378f6a28cc7378b13 # v1.1.2
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}  # zizmor: ignore[secrets-outside-env]
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: clear

      - name: Allow replication
        run: sleep 10s

  call-sonatype-lifecycle:
    name: 'Sonatype Lifecycle/CLM -> Nexus IQ'
    if: always()
    needs: [notify]
    permissions:
      contents: read
    # yamllint disable-line rule:line-length
    uses: lfit/releng-reusable-workflows/.github/workflows/reuse-sonatype-lifecycle.yaml@eb97ae44b0af065a905ddd74b7ac7416796c8554  # v0.9.0
    with:
      # Nexus IQ CLI runtime uses the reusable workflow defaults:
      # temurin JDK 17 with IQ CLI 2.4.2-01 (CLI 2.x requires Java 17)
      # Gerrit-aware checkout when dispatched with a change refspec
      # yamllint disable-line rule:line-length
      gerrit_refspec: ${{ inputs.GERRIT_DISABLED != true && inputs.GERRIT_REFSPEC || '' }}
      # yamllint disable-line rule:line-length
      gerrit_project: ${{ inputs.GERRIT_DISABLED != true && inputs.GERRIT_PROJECT || '' }}
      # Pre-scan build populating the workspace; runs with its own JDK
      # (project code does not build with the CLI runtime JDK)
      build_type: 'maven'
      build_java_version: 11
      mvn_version: '3.9.5'
      mvn_phases: 'clean package'
      mvn_params: '-DskipTests -Djib.skip=true --fail-at-end'
      mvn_opts: >-
        -Ddocker.push.registry=nexus3.onap.org:10003
        -Ddocker.pull.registry=nexus3.onap.org:10003
        -Dmaven.repo.local=/tmp/r
        -Dorg.ops4j.pax.url.mvn.localRepository=/tmp/r
        -DaltDeploymentRepository=staging::default::file:"${GITHUB_WORKSPACE}"/m2repo
        -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
      # Loads NEXUS_SERVER_PASSWORD for the global_settings below;
      # {project} resolves from the repository .gitreview file
      op_secret_reference: 'op://elnqtgip7eqavqvgodjbiiaqd4/{project}/password'
      # The pre-scan build fetches node/npm artefacts from endpoints
      # not in the shared allow-list; audit matches prior behaviour
      egress_policy: 'audit'
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}
      op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      global_settings: |
        <settings>
          <servers>
            <server>
              <id>ecomp-releases</id>
              <username>usecase-ui</username>
              <password>${env.NEXUS_SERVER_PASSWORD}</password>
            </server>
            <server>
              <id>ecomp-snapshots</id>
              <username>usecase-ui</username>
              <password>${env.NEXUS_SERVER_PASSWORD}</password>
            </server>
            <server>
              <id>onap-releases</id>
              <username>usecase-ui</username>
              <password>${env.NEXUS_SERVER_PASSWORD}</password>
            </server>
            <server>
              <id>onap-snapshots</id>
              <username>usecase-ui</username>
              <password>${env.NEXUS_SERVER_PASSWORD}</password>
            </server>
            <server>
              <id>nexus3.onap.org:10003</id>
              <username>usecase-ui</username>
              <password>${env.NEXUS_SERVER_PASSWORD}</password>
            </server>
          </servers>
          <mirrors>
            <mirror>
              <id>onap-public</id>
              <mirrorOf>*</mirrorOf>
              <url>https://nexus.onap.org/content/groups/public/</url>
            </mirror>
          </mirrors>
          <profiles>
            <profile>
              <id>onap-nexus</id>
              <repositories>
                <repository>
                  <id>onap-public</id>
                  <url>https://nexus.onap.org/content/groups/public/</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>onap-public</id>
                  <url>https://nexus.onap.org/content/groups/public/</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>onap-nexus</activeProfile>
          </activeProfiles>
        </settings>

  report-status:
    name: 'Report status to Gerrit'
    # yamllint disable-line rule:line-length
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.GERRIT_DISABLED != true }}
    needs: [notify, call-sonatype-lifecycle]
    runs-on: ubuntu-latest
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Get workflow conclusion
        # yamllint disable-line rule:line-length
        uses: im-open/workflow-conclusion@8eac7f17381a6917bc04fec3e2c92e70ebc37526 # v3.0.0

      - name: Report workflow conclusion
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@a1c036a59b94c8ab89de26d378f6a28cc7378b13 # v1.1.2
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}  # zizmor: ignore[secrets-outside-env]
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: ${{ env.WORKFLOW_CONCLUSION }}
